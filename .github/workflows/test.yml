name: test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'   

      - name: Install NPM packages
        run: npm install

      - name: Run Forge build
        id: build
        run: |
          forge --version
          forge build --sizes
